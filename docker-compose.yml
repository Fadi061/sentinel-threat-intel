services:
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  app:
    build: .
    container_name: sentinel-threat-intel
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - SLACK_TOKEN=${SLACK_TOKEN}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-"#security-threat-intel-alerts"}
    restart: unless-stopped
    networks:
      - sentinel-network

volumes:
  redis_data:

networks:
  sentinel-network:
    driver: bridge

